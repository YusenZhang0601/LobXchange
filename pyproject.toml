[project]
name = "lobx-exchange"
version = "0.1.0"
description = "Glue and bootstrap tooling for the WSL LOBX exchange prototype"
requires-python = ">=3.10"

[project.optional-dependencies]
mesa = ["Mesa>=4.0.0a0"]

[project.scripts]
lobx = "lobx.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
